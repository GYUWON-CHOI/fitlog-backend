services:
  postgres:
    image: postgres:16
    container_name: fitlog-postgres
    environment:
      POSTGRES_DB: fitlog
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1234
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: fitlog-redis
    ports:
      - "6379:6379"

volumes:
  postgres_data: